<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BonnaAlert Dhaka</title>
<meta name="description" content="ঢাকার প্রতিটি ওয়ার্ডের জন্য ৭২ ঘণ্টা আগাম বন্যা ও জলাবদ্ধতার সতর্কতা">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..100,500..800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --silt:#EAF0EE; --panel:#F7FAF9; --ink:#12302F; --muted:#56706C; --line:#C8D5D2;
  --river:#1E6C8C; --river-soft:#CFE3EA;
  --red:#B3261E; --orange:#D2621C; --yellow:#C9971A; --green:#4B8B5A;
  --display:"Anek Bangla","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--silt);color:var(--ink);font:16px/1.55 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}

.app{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head main" "list main";height:100vh}
.head{grid-area:head;padding:22px 24px 16px;background:var(--panel);border-right:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0}
.brand b{font:800 30px/1 var(--display);font-stretch:78%;letter-spacing:-.01em}
.brand span{font:500 15px/1.2 var(--display);font-stretch:90%;color:var(--muted)}
.status{font:600 23px/1.25 var(--display);font-stretch:88%;margin:16px 0 10px;max-width:22ch}
.levelbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.levelbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.meta{font-size:13px;color:var(--muted);margin-top:12px}
.demo{display:inline-block;background:var(--ink);color:var(--silt);border-radius:4px;padding:0 7px;margin-right:6px;font-size:12.5px}
.runs{display:flex;gap:6px;margin-top:12px}
.runs a{font-size:13.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.runs a[aria-current=page]{background:var(--ink);color:var(--silt);border-color:var(--ink)}

.list{grid-area:list;overflow:auto;min-height:0;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel);margin:0;padding:0;list-style:none}
.list button{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 24px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.list button:hover{background:#EEF4F2}
.list button[aria-pressed=true]{background:var(--river-soft)}
.rk{font:600 15px var(--display);color:var(--muted)}
.wn{font-weight:500;line-height:1.3}
.wn small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.rv{display:flex;align-items:center;gap:7px;font:600 16px var(--display)}
.dot{width:10px;height:10px;border-radius:50%}

.main{grid-area:main;position:relative;min-height:0}
#map{position:absolute;inset:0;background:#DCE6E3}
.leaflet-container{font-family:var(--body)}

.card{position:absolute;right:16px;bottom:16px;top:16px;width:380px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:20px 22px;box-shadow:0 8px 28px rgba(18,48,47,.16)}
.card h2{font:700 26px/1.15 var(--display);font-stretch:85%;margin:0 0 8px}
.badge{display:inline-block;color:#fff;border-radius:5px;padding:2px 10px;font-weight:600;font-size:14.5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.nums div{border-left:3px solid var(--line);padding-left:9px}
.nums b{display:block;font:700 26px/1.1 var(--display);font-stretch:85%;white-space:nowrap}
.nums span{font-size:13px;color:var(--muted);line-height:1.25;display:block}
.card h3{font:600 16px var(--display);margin:22px 0 8px}
.rain svg{display:block;width:100%;height:auto}
.why{margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:14.5px;padding:4px 0}
.why .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.why .bar i{display:block;height:100%;background:var(--ink)}
.alert{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--silt);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.5}
.empty{color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"head" "main" "list";height:auto}
  .head,.list{border-right:0}
  #map{position:relative;height:58vh}
  .card{position:static;width:auto;margin:0;border-radius:0;border-width:1px 0;box-shadow:none}
  .head{padding:18px 16px 14px}
  .list button{padding:10px 16px}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:opacity .2s}
}
</style>
</head>
<body>
<div class="app">
    <header class="head">
      <h1 class="brand"><b>BonnaAlert</b><span>ঢাকা ওয়ার্ড সতর্কতা</span></h1>
      <p class="status" id="status">পূর্বাভাস লোড হচ্ছে…</p>
      <div class="levelbar" id="levelbar" aria-hidden="true"></div>
      <div class="legend" id="legend"></div>
      <div class="meta" id="meta"></div>
      <nav class="runs" aria-label="কোন রান দেখবেন">
        <a href="./" id="run-live">এখনকার পূর্বাভাস</a>
        <a href="./?run=replay-2023-09-21" id="run-replay">২১ সেপ্টেম্বর ২০২৩ রিপ্লে</a>
      </nav>
    </header>
  <main class="main">
    <div id="map" role="region" aria-label="ওয়ার্ড ঝুঁকির মানচিত্র"></div>
    <section class="card" id="card" aria-live="polite"><p class="empty">একটি ওয়ার্ড বেছে নিন।</p></section>
  </main>
  <ol class="list" id="list" aria-label="ঝুঁকি অনুযায়ী ওয়ার্ডের তালিকা"></ol>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LEVELS = {
  red:{bn:"লাল", act:"এখনই ব্যবস্থা নিন", c:"var(--red)", hex:"#B3261E"},
  orange:{bn:"কমলা", act:"প্রস্তুতি নিন", c:"var(--orange)", hex:"#D2621C"},
  yellow:{bn:"হলুদ", act:"সতর্ক থাকুন", c:"var(--yellow)", hex:"#C9971A"},
  green:{bn:"সবুজ", act:"ঝুঁকি কম", c:"var(--green)", hex:"#4B8B5A"}
};
const DRIVER_BN = {
  log_runoff:"বৃষ্টির পানি গড়িয়ে জমা (রানঅফ)",
  twi_z:"নিচু, পানি জমার প্রবণ ভূমি",
  low_elev_share:"৪ মিটারের নিচের জমি",
  built_share:"পাকা ও দালানঘেরা এলাকা"
};
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const bn = x => String(x).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const pct = x => bn(Math.round(x * 100)) + "%";
const big = n => n >= 1e5 ? bn((n/1e5).toFixed(1)) + " লাখ" : bn(Math.round(n/1e3)) + " হাজার";
const parse = v => typeof v === "string" ? (()=>{ try { return JSON.parse(v) } catch { return v } })() : v;
function bnTime(iso){
  const [d,t] = iso.split("T"); const h = +t.slice(0,2);
  const part = h>=4&&h<6?"ভোর":h<12&&h>=6?"সকাল":h>=12&&h<15?"দুপুর":h>=15&&h<18?"বিকেল":h>=18&&h<20?"সন্ধ্যা":"রাত";
  return `${bn(+d.slice(8))} ${MONTHS[+d.slice(5,7)-1]}, ${part} ${bn(h%12||12)}টা`;
}

let wards = [], hourly = null, layerById = {}, selected = null, map, geo;
const RUN = /^[a-z0-9-]+$/.test(new URLSearchParams(location.search).get("run") || "") ? new URLSearchParams(location.search).get("run") : "";
const BASE = RUN ? `data/${RUN}/` : "data/";
document.getElementById(RUN ? "run-replay" : "run-live").setAttribute("aria-current", "page");

Promise.all([
  fetch(BASE + "wards_scored.geojson").then(r => r.json()),
  fetch(BASE + "summary.json").then(r => r.json()),
  fetch(BASE + "hourly.json").then(r => r.json()).catch(() => null)
]).then(([gj, summary, hr]) => {
  hourly = hr;
  gj.features.forEach(f => { f.properties.drivers = parse(f.properties.drivers) || []; f.properties.contrib = parse(f.properties.contrib) || {}; });
  wards = gj.features.slice().sort((a,b) => a.properties.rank - b.properties.rank);
  renderHeader(summary);
  renderMap(gj);
  renderList();
  select(wards[0].properties.ward_id, false);
}).catch(err => {
  document.getElementById("status").textContent = "ডেটা পাওয়া যায়নি। পাইপলাইন চালিয়ে docs/data ফোল্ডার তৈরি করুন।";
  console.error(err);
});

function renderHeader(s){
  const c = s.counts, n = s.n_wards;
  const hot = c.red + c.orange;
  document.getElementById("status").textContent = hot
    ? `আগামী ৭২ ঘণ্টায় ${bn(hot)}টি ওয়ার্ডে জলাবদ্ধতার বড় ঝুঁকি, প্রায় ${big(s.people_orange_red)} মানুষ`
    : (s.counts.yellow ? `বড় ঝুঁকি নেই, ${bn(s.counts.yellow)}টি ওয়ার্ডে সতর্ক থাকার মতো বৃষ্টি` : "আগামী ৭২ ঘণ্টায় কোনো ওয়ার্ডে জলাবদ্ধতার ঝুঁকি নেই");
  if (s.forecast_source.startsWith("replay")) document.getElementById("status").textContent = "রিপ্লে: " + document.getElementById("status").textContent.replace("আগামী ৭২ ঘণ্টায়", "সেই ৭২ ঘণ্টায়");
  document.getElementById("levelbar").innerHTML = ["red","orange","yellow","green"]
    .map(k => `<i style="width:${100*c[k]/n}%;background:${LEVELS[k].c}"></i>`).join("");
  document.getElementById("legend").innerHTML = ["red","orange","yellow","green"]
    .map(k => `<span style="--c:${LEVELS[k].c}">${LEVELS[k].bn} ${bn(c[k])}</span>`).join("");
  const run = new Date(new Date(s.run_utc.replace("Z",":00Z")).getTime() + 6*3600e3).toISOString();
  const local = bnTime(run.slice(0,16)) + " " + bn(run.slice(14,16)) + " মিনিট";
  document.getElementById("meta").innerHTML =
    (s.forecast_source === "demo" ? `<span class="demo">ডেমো ডেটা</span>` : "") +
    (s.forecast_source.startsWith("replay") ? `<span class="demo">আর্কাইভ বৃষ্টি (ERA5)</span>১৯–২২ সেপ্টেম্বর ২০২৩ এর বৃষ্টি দিয়ে চালানো। ` : `হালনাগাদ ${local}। `) +
    `মডেল: ${s.model}`;
}

function renderMap(gj){
  map = L.map("map", {zoomControl:true, attributionControl:true});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);
  geo = L.geoJSON(gj, {
    style: f => ({color:"#ffffff", weight:.8, fillColor:LEVELS[f.properties.level].hex, fillOpacity:.58}),
    onEachFeature: (f, layer) => {
      layerById[f.properties.ward_id] = layer;
      layer.bindTooltip(`${f.properties.name}: ${LEVELS[f.properties.level].bn}`, {sticky:true});
      layer.on("click", () => select(f.properties.ward_id, false));
    }
  }).addTo(map);
  map.fitBounds(geo.getBounds(), fitOpts());
  map.attributionControl.addAttribution("Rain: Open-Meteo");
}

// keep the selected area clear of the detail card on wide screens
const fitOpts = () => innerWidth > 900 ? {paddingTopLeft:[30,30], paddingBottomRight:[420,30]} : {padding:[16,16]};

function renderList(){
  document.getElementById("list").innerHTML = wards.map(f => {
    const p = f.properties, L_ = LEVELS[p.level];
    return `<li><button data-id="${p.ward_id}" aria-pressed="false">
      <span class="rk">${bn(p.rank)}</span>
      <span class="wn">${p.name}<small>২৪ ঘণ্টায় ${bn(Math.round(p.p24_max))} মিমি বৃষ্টি</small></span>
      <span class="rv"><span class="dot" style="background:${L_.c}"></span>${pct(p.risk)}</span>
    </button></li>`;
  }).join("");
  document.getElementById("list").addEventListener("click", e => {
    const b = e.target.closest("button[data-id]"); if (b) select(b.dataset.id, true);
  });
}

function select(id, pan){
  if (selected && layerById[selected]) geo.resetStyle(layerById[selected]);
  selected = id;
  const layer = layerById[id];
  layer.setStyle({color:"#12302F", weight:3});
  layer.bringToFront();
  if (pan) map.fitBounds(layer.getBounds(), Object.assign(fitOpts(), {maxZoom:14}));
  document.querySelectorAll(".list button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
  renderCard(wards.find(f => f.properties.ward_id === id).properties);
  if (pan && innerWidth <= 900) document.getElementById("map").scrollIntoView({behavior:"smooth"});
}

function rainStrip(id, level){
  if (!hourly || !hourly.rain_mm[id]) return "";
  const r = hourly.rain_mm[id], t = hourly.times, W = 336, H = 92, bw = W / r.length;
  const max = Math.max(4, ...r), pk = r.indexOf(Math.max(...r));
  const bars = r.map((v,i) => `<rect x="${(i*bw).toFixed(1)}" y="${(H-18-(v/max)*(H-34)).toFixed(1)}" width="${(bw-.8).toFixed(1)}" height="${((v/max)*(H-34)).toFixed(1)}" fill="${i===pk?LEVELS[level].hex:"#1E6C8C"}" opacity="${i===pk?1:.75}"/>`).join("");
  const ticks = [0,24,48].map(h => `<text x="${(h*bw+2).toFixed(1)}" y="${H-3}" font-size="11" fill="#56706C">${t[h]?bnTime(t[h]).split(",")[0]:""}</text><line x1="${(h*bw).toFixed(1)}" x2="${(h*bw).toFixed(1)}" y1="10" y2="${H-16}" stroke="#C8D5D2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="প্রতি ঘণ্টার বৃষ্টির পূর্বাভাস, সর্বোচ্চ ${bn(r[pk])} মিমি">${ticks}${bars}
    <text x="${Math.min(W-90, pk*bw+6).toFixed(1)}" y="12" font-size="11.5" fill="#12302F">সর্বোচ্চ ${bn(r[pk])} মিমি/ঘণ্টা</text></svg>`;
}

function renderCard(p){
  const L_ = LEVELS[p.level];
  const contrib = Object.entries(p.contrib).filter(([k,v]) => v > 0 && DRIVER_BN[k]).sort((a,b) => b[1]-a[1]);
  const cmax = Math.max(0.01, ...contrib.map(c => c[1]));
  const why = contrib.map(([k,v]) => `<li><span>${DRIVER_BN[k]}</span><span class="bar"><i style="width:${100*v/cmax}%"></i></span></li>`).join("")
    + `<li><span>জনগোষ্ঠীর ঝুঁকি (ঘনবসতি, নিচু এলাকা)</span><span class="bar"><i style="width:${100*p.vuln_norm}%;background:var(--river)"></i></span></li>`;
  const capLink = (p.level === "red" || p.level === "orange") ? `<a class="btn ghost" href="${BASE}cap/${p.ward_id}.xml" download>CAP ফাইল নামান</a>` : "";
  document.getElementById("card").innerHTML = `
    <h2>${p.name}</h2>
    <span class="badge" style="background:${L_.c}">${L_.bn}: ${L_.act}</span>
    <div class="nums">
      <div><b>${pct(p.prob)}</b><span>জলাবদ্ধতার সম্ভাবনা</span></div>
      <div><b>${bn(Math.round(p.p24_max))}</b><span>মিমি, সর্বোচ্চ ২৪ ঘণ্টায়</span></div>
      <div><b>${bn(Math.round(p.pop_total).toLocaleString("en-IN"))}</b><span>মানুষ এই ওয়ার্ডে</span></div>
    </div>
    <h3>${RUN ? "সেই ৭২ ঘণ্টার বৃষ্টি" : "আগামী ৭২ ঘণ্টার বৃষ্টি"}</h3>
    <div class="rain">${rainStrip(p.ward_id, p.level)}</div>
    <h3>ঝুঁকি কেন</h3>
    <ul class="why">${why}</ul>
    ${p.alert_bn ? `<h3>সতর্কবার্তা</h3><div class="alert" style="--c:${L_.c}">${p.alert_bn.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>
    <div class="row"><button class="btn" id="copy">বার্তা কপি করুন</button>${capLink}</div>` : `<p class="note">এই ওয়ার্ডের জন্য এখন কোনো সতর্কবার্তা নেই।</p>`}
    <p class="note">ঝুঁকি স্কোর ${pct(p.risk)} = সম্ভাবনা × জনগোষ্ঠীর ঝুঁকির ভার। প্রোটোটাইপ: করণীয় অংশ খসড়া, সরকারি নির্দেশনা দিয়ে হালনাগাদ করা হবে।</p>`;
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = () => navigator.clipboard.writeText(p.alert_bn).then(() => { copy.textContent = "কপি হয়েছে"; }, () => { copy.textContent = "কপি করা যায়নি"; });
}
</script>
</body>
</html>
