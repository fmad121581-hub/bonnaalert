name: Ward forecast

on:
  schedule:
    # 05:53 and 17:53 Dhaka time (UTC+6)
    - cron: "53 23,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Forecast, score, alerts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python scripts/run_all.py --llm; else python scripts/run_all.py; fi
      - name: Publish results
        run: |
          git config user.name "bonnaalert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Forecast run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
